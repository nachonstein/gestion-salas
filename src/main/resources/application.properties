spring.application.name=gestion-salas

# PostgreSQL credentials must be supplied by the deployment environment.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# External API integration configuration.
external.api.base-url=${EXTERNAL_API_BASE_URL}
external.api.timeout=${EXTERNAL_API_TIMEOUT:5s}
